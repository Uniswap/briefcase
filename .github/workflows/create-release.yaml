name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "deployments/**"
jobs:
  create-release:
    permissions:
      contents: write
      id-token: write
    runs-on:
      group: npm-deploy
    environment:
      name: release
    steps:
      - uses: bullfrogsec/bullfrog@1831f79cce8ad602eef14d2163873f27081ebfb3 # v0.8.4

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Incrementing the version in package.json allows us to bump the major or minor version by bumping the version in the package.json file to X.X.-1
      - name: Get latest tag from package.json
        id: latest_tag_package_json
        run: echo "LATEST_TAG=v$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      # Use latest tag from github tag history to generate the changelog
      - name: Get latest tag from tag history
        id: latest_tag
        run: echo "LATEST_TAG=$(git describe --tags --abbrev=0 || echo v0.0.0)" >> $GITHUB_OUTPUT

      - name: Increment version
        id: increment_version
        run: |
          if [[ -z "${LATEST_TAG}" || "${LATEST_TAG}" == "v0.0.0" ]]; then
            echo "NEW_VERSION=v0.0.1" >> $GITHUB_OUTPUT
          else
            latest_version=${LATEST_TAG#v}
            IFS='.' read -ra version_parts <<< "$latest_version"
            version_parts[2]=$((version_parts[2] + 1))
            new_version="${version_parts[0]}.${version_parts[1]}.${version_parts[2]}"
            echo "NEW_VERSION=v$new_version" >> $GITHUB_OUTPUT
          fi
        env:
          LATEST_TAG: ${{ steps.latest_tag_package_json.outputs.LATEST_TAG }}

      - name: Update package.json version
        run: |
          new_version=${{ steps.increment_version.outputs.NEW_VERSION }}
          jq --arg new_version "${new_version#v}" '.version = $new_version' package.json > package.json.tmp && mv package.json.tmp package.json
        env:
          NEW_VERSION: ${{ steps.increment_version.outputs.NEW_VERSION }}

      - name: Generate changelog
        id: generate_changelog
        run: |
          echo "Debug: Latest tag is ${{ steps.latest_tag.outputs.LATEST_TAG }}"

          changelog=""
          if [[ "${{ steps.latest_tag.outputs.LATEST_TAG }}" == "v0.0.0" ]]; then
            echo "Debug: No previous tag found, getting all changes in src directory"
            git diff --name-status $(git hash-object -t tree /dev/null)
            
            while IFS= read -r line; do
              status=$(echo $line | cut -d' ' -f1)
              file=$(echo $line | cut -d' ' -f2-)
              echo "Debug: Processing file: $file with status: $status"
              if [[ $file == *src/* || $file == *deployments/* ]]; then
                case $status in
                  A) action="Added";;
                  M) action="Modified";;
                  D) action="Deleted";;
                  *) action="Changed";;
                esac
                changelog+="- $action [$file](https://github.com/${{ github.repository }}/commit/${{ github.sha }}#diff-$(echo -n $file | sha256sum | cut -d' ' -f1))"$'\n'
                echo "Debug: Added to changelog: $action $file"
              else
                echo "Debug: Skipped file (not in src/ or deployments/): $file"
              fi
            done < <(git diff --name-status $(git hash-object -t tree /dev/null))
          else
            echo "Debug: Previous tag found, getting changes since ${{ steps.latest_tag.outputs.LATEST_TAG }}"
            git diff --name-status ${{ steps.latest_tag.outputs.LATEST_TAG }}
            while IFS= read -r line; do
              status=$(echo $line | cut -d' ' -f1)
              file=$(echo $line | cut -d' ' -f2-)
              echo "Debug: Processing file: $file with status: $status"
              if [[ $file == *src/* || $file == *deployments/* ]]; then
                case $status in
                  A) action="Added";;
                  M) action="Modified";;
                  D) action="Deleted";;
                  *) action="Changed";;
                esac
                changelog+="- $action [$file](https://github.com/${{ github.repository }}/commit/${{ github.sha }}#diff-$(echo -n $file | sha256sum | cut -d' ' -f1))"$'\n'
                echo "Debug: Added to changelog: $action $file"
              else
                echo "Debug: Skipped file (not in src/ or deployments/): $file"
              fi
            done < <(git diff --name-status ${{ steps.latest_tag.outputs.LATEST_TAG }})
          fi

          echo "Debug: Final changelog:"
          echo "$changelog"

          # Per-call unguessable heredoc delimiter (defense in depth against
          # the $GITHUB_OUTPUT duplicate-key last-write-wins injection class).
          # Fail fast if openssl returns empty or body exceeds 1MB cap.
          CL_DELIM_RAND=$(openssl rand -hex 16)
          [ -n "$CL_DELIM_RAND" ] || { echo "::error::openssl rand returned empty" >&2; exit 1; }
          [ "$(printf '%s' "$changelog" | wc -c)" -lt 900000 ] || { echo "::error::changelog exceeds 900KB" >&2; exit 1; }
          CL_DELIM="CHANGELOG_DELIMITER_$(date +%s%N)_${CL_DELIM_RAND}"
          echo "CHANGELOG<<${CL_DELIM}" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "${CL_DELIM}" >> "$GITHUB_OUTPUT"

          if [ -z "$changelog" ]; then
            echo "Error: Changelog is empty"
            exit 1
          else
            echo "Success: Changelog generated"
          fi

      # The version-bump push is authorized by a GitHub App installed on this repo,
      # not a deploy key: a deploy key's pushes are attributed to the person who
      # created it, and the main ruleset only lets the App bypass the pull-request rule.
      - name: Mint a push token
        id: push-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          client-id: ${{ secrets.BRIEFCASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BRIEFCASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit updated package.json
        env:
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "Release ${{ steps.increment_version.outputs.NEW_VERSION }}"
          # The token goes on the push command only, so it is never written to .git/config.
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Create Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.increment_version.outputs.NEW_VERSION }}
          name: Release ${{ steps.increment_version.outputs.NEW_VERSION }}
          body: |
            Changes:
            ${{ steps.generate_changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false

      - name: Publish package to npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm
        run: npm install -g github:npm/cli#6d1db8724b1d0e5457a87bb31e62e43d566348ce # npm@11.7.0

      - run: npm publish
